<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ language }} · {{ level }} Roadmap</title>
    <style>
        body { font-family: DejaVu Sans, Arial, sans-serif; font-size: 12px; }
        h1 { font-size: 20px; margin-bottom: 10px; }
        h2 { font-size: 14px; margin: 10px 0 5px 0; }
        .step { border: 1px solid #ccc; padding: 8px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h1>{{ language }} · {{ level|title }} Roadmap</h1>

    {% for step in steps %}
        <div class="step">
            <h2>Week {{ step.week }} · {{ step.title }}</h2>
            <p>{{ step.description|linebreaks }}</p>
        </div>
    {% empty %}
        <p>No steps for this language/level.</p>
    {% endfor %}
</body>
</html>
